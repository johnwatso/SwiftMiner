name: SwiftMiner

options:
  bundleIdPrefix: com.swifttwitchminer
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.8.0

targets:
  SwiftTwitchMiner:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftMiner:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftTwitchMinerApp
        excludes:
          - Info.plist
      - path: SwiftMiner.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SwiftTwitchMiner
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/SwiftTwitchMinerApp/Info.plist
      properties:
        CFBundleIconFile: SwiftMiner
    settings:
      base:
        PRODUCT_NAME: SwiftMiner
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.swifttwitchminer.app
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftMiner
        INFOPLIST_KEY_CFBundleName: SwiftMiner
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUFeedURL: $(SPARKLE_FEED_URL)
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: SwiftMiner
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SPARKLE_FEED_URL: https://johnwatso.github.io/SwiftMiner/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "4Aht0ilQOmLxGQMnSwGNJvtZ0VKH7lZoV4Raag6eEN8="

  SwiftTwitchMinerCLI:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftTwitchMinerCLI
    dependencies:
      - target: SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"

  SwiftTwitchMinerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES

  SparklePublisher:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tools/SparklePublisher
    settings:
      base:
        PRODUCT_NAME: SparklePublisher
        PRODUCT_BUNDLE_IDENTIFIER: com.swifttwitchminer.sparklepublisher
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  SwiftMiner:
    build:
      targets:
        SwiftMiner: all
        SwiftTwitchMinerTests: [test]
    run:
      config: Debug
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    test:
      config: Debug
      targets:
        - SwiftTwitchMinerTests
    archive:
      config: Release

  SwiftTwitchMinerCLI:
    build:
      targets:
        SwiftTwitchMinerCLI: all
    run:
      config: Debug
      commandLineArguments: []
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    archive:
      config: Release

  SparklePublisher:
    build:
      targets:
        SparklePublisher: all
    run:
      config: Debug
    archive:
      config: Release
