name: SwiftMiner

options:
  bundleIdPrefix: com.swiftminer
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.8.0

targets:
  SwiftMinerCore:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftMinerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftMiner:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMiner
        excludes:
          - Info.plist
      - path: SwiftMiner.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SwiftMinerCore
      - target: SwiftMinerService
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/SwiftMiner/Info.plist
      properties:
        CFBundleIconFile: SwiftMiner
    settings:
      base:
        PRODUCT_NAME: SwiftMiner
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.app
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.05"
        CURRENT_PROJECT_VERSION: "2026032214"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SwiftMiner
        INFOPLIST_KEY_CFBundleName: SwiftMiner
        INFOPLIST_KEY_SUEnableAutomaticChecks: YES
        INFOPLIST_KEY_SUFeedURL: $(SPARKLE_FEED_URL)
        INFOPLIST_KEY_SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: SwiftMiner
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SPARKLE_FEED_URL: https://johnwatso.github.io/SwiftMiner/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "OTycmeGRCsewFd9QUCV93CiC40oE+iiewSfWMptLeLI="

  SwiftMinerService:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMinerService
        excludes:
          - main.swift
    dependencies:
      - target: SwiftMinerCore
    settings:
      base:
        PRODUCT_NAME: SwiftMinerService
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.service
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftMinerServiceTool:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMinerService/main.swift
    dependencies:
      - target: SwiftMinerCore
      - target: SwiftMinerService
    settings:
      base:
        PRODUCT_NAME: SwiftMinerServiceTool
        SWIFT_VERSION: "6.0"

  SwiftMinerCLI:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftMinerCLI
    dependencies:
      - target: SwiftMinerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"

  SwiftMinerCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: SwiftMinerCore
        link: false
      - target: SwiftMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwiftMiner.app/Contents/MacOS/SwiftMiner
        BUNDLE_LOADER: $(TEST_HOST)

  SparklePublisher:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tools/SparklePublisher
    settings:
      base:
        PRODUCT_NAME: SparklePublisher
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.sparklepublisher
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  SwiftMiner:
    build:
      targets:
        SwiftMiner: all
        SwiftMinerCoreTests: [test]
    run:
      config: Debug
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    test:
      config: Debug
      targets:
        - SwiftMinerCoreTests
    archive:
      config: Release

  SwiftMinerCLI:
    build:
      targets:
        SwiftMinerCLI: all
    run:
      config: Debug
      commandLineArguments: []
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    archive:
      config: Release

  SparklePublisher:
    build:
      targets:
        SparklePublisher: all
    run:
      config: Debug
    archive:
      config: Release
