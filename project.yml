name: SwiftMiner

options:
  bundleIdPrefix: com.swiftminer
  createIntermediateGroups: true
  xcodeVersion: "2640"
  schemeVersion: "1.3"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.8.0
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    from: 1.0.0

targets:
  SwiftMinerCore:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftMinerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftMiner:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMiner
        excludes:
          - Info.plist
      - path: SwiftMiner.icon
        type: file
        buildPhase: resources
      - path: Sources/SwiftMiner/WebAssets/web-logo-dark.png
        type: file
        buildPhase: resources
      - path: Sources/SwiftMiner/WebAssets/web-logo-light.png
        type: file
        buildPhase: resources
    dependencies:
      - target: SwiftMinerCore
      - target: SwiftMinerService
      - package: Sparkle
        product: Sparkle
      - package: AsyncAlgorithms
        product: AsyncAlgorithms
    info:
      path: Sources/SwiftMiner/Info.plist
      properties:
        CFBundleIconFile: SwiftMiner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUAutomaticallyUpdate: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        CFBundleURLTypes:
          - CFBundleURLName: com.swiftminer.pair
            CFBundleURLSchemes:
              - swiftminer
    settings:
      base:
        PRODUCT_NAME: SwiftMiner
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.app
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.32.3"
        CURRENT_PROJECT_VERSION: "2026070216"
        INFOPLIST_KEY_CFBundleDisplayName: SwiftMiner
        INFOPLIST_KEY_CFBundleName: SwiftMiner
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: SwiftMiner
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SPARKLE_FEED_URL: https://johnwatso.github.io/SwiftMiner/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "rxaJsfCpTKtpqRubSfkJwKnztT5S8RHsdAueuT+jKck="

  SwiftMinerService:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMinerService
        excludes:
          - main.swift
    dependencies:
      - target: SwiftMinerCore
    settings:
      base:
        PRODUCT_NAME: SwiftMinerService
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.service
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftMinerServiceTool:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftMinerService/main.swift
    dependencies:
      - target: SwiftMinerCore
      - target: SwiftMinerService
    settings:
      base:
        PRODUCT_NAME: SwiftMinerServiceTool
        SWIFT_VERSION: "6.0"

  SwiftMinerCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
      - path: project.yml
        type: file
        buildPhase: resources
    dependencies:
      - target: SwiftMinerCore
        link: false
      - target: SwiftMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        # Principal class arms the fail-fast network guard (Tests/NetworkGuard.swift)
        # at bundle startup so it applies to every suite, even ones that forget to mock.
        INFOPLIST_KEY_NSPrincipalClass: NetworkGuardBootstrap
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SwiftMiner.app/Contents/MacOS/SwiftMiner
        BUNDLE_LOADER: $(TEST_HOST)

  SparklePublisher:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tools/SparklePublisher
    settings:
      base:
        PRODUCT_NAME: SparklePublisher
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftminer.sparklepublisher
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  SwiftMiner:
    build:
      targets:
        SwiftMiner: all
        SwiftMinerCoreTests: [test]
    run:
      config: Debug
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    test:
      config: Debug
      targets:
        - SwiftMinerCoreTests
    archive:
      config: Release

  SparklePublisher:
    build:
      targets:
        SparklePublisher: all
    run:
      config: Debug
    archive:
      config: Release
