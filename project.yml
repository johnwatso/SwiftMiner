name: SwiftTwitchMiner

options:
  bundleIdPrefix: com.swifttwitchminer
  createIntermediateGroups: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.8.0

targets:
  SwiftTwitchMiner:
    type: library.static
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_STRICT_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete

  SwiftTwitchMinerApp:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/SwiftTwitchMinerApp
        excludes:
          - Info.plist
      - path: SwiftMiner.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: SwiftTwitchMiner
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/SwiftTwitchMinerApp/Info.plist
      properties:
        CFBundleIconFile: SwiftMiner
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUEnableAutomaticChecks: true
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
    settings:
      base:
        PRODUCT_NAME: SwiftMiner
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_BUNDLE_IDENTIFIER: com.swifttwitchminer.app
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SPARKLE_FEED_URL: https://johnwatso.github.io/SwiftMiner/appcast.xml
        SPARKLE_PUBLIC_ED_KEY: "4Aht0ilQOmLxGQMnSwGNJvtZ0VKH7lZoV4Raag6eEN8="

  SwiftTwitchMinerCLI:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/SwiftTwitchMinerCLI
    dependencies:
      - target: SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"

  SwiftTwitchMinerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: SwiftTwitchMiner
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  SparklePublisher:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Tools/SparklePublisher
    settings:
      base:
        PRODUCT_NAME: SparklePublisher
        PRODUCT_BUNDLE_IDENTIFIER: com.swifttwitchminer.sparklepublisher
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"

schemes:
  SwiftTwitchMiner:
    build:
      targets:
        SwiftTwitchMinerApp: all
        SwiftTwitchMinerTests: [test]
    run:
      config: Debug
      environmentVariables:
        TWITCH_CLIENT_ID: ""
    test:
      config: Debug
      targets:
        - SwiftTwitchMinerTests
    archive:
      config: Release

  SparklePublisher:
    build:
      targets:
        SparklePublisher: all
    run:
      config: Debug
    archive:
      config: Release
