name: Twitch query hash monitor

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: twitch-query-hash-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check TwitchDropsMiner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test monitor
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Check upstream persisted-query hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_twitchdropsminer_upstream.py
