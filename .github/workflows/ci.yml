name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "Website/**"
      - "docs/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "Website/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.46.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pinned deliberately. The drift check below compares generated output byte for
      # byte, and XcodeGen reorders parts of the project between releases — 2.46.0
      # sorts the target list differently to 2.45.4 — so `brew install xcodegen`
      # turns any upstream release into a red build on an unchanged repository.
      # Bump this together with the local version used to regenerate the project.
      - name: Install XcodeGen ${{ env.XCODEGEN_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/xcodegen.zip \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          # The archive's internal layout is XcodeGen's to change; locate the binary
          # rather than hard-coding a path that a future release could move.
          binary="$(find /tmp/xcodegen -type f -name xcodegen -perm -u+x | head -n 1)"
          if [[ -z "$binary" ]]; then
            echo "::error::No xcodegen binary found in the $XCODEGEN_VERSION archive."
            exit 1
          fi
          echo "$(dirname "$binary")" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen

      # The generated project is committed, so it can drift from project.yml the moment
      # someone edits one without regenerating the other. Everything downstream builds the
      # generated copy, which means the drift only ever shows up locally, in Xcode.
      - name: Check the committed Xcode project matches project.yml
        run: |
          if ! git diff --quiet -- SwiftMiner.xcodeproj; then
            echo "::error::SwiftMiner.xcodeproj is out of date with project.yml. Run 'xcodegen' ($XCODEGEN_VERSION) and commit the result."
            git diff -- SwiftMiner.xcodeproj
            exit 1
          fi

      - name: Test release-maintenance scripts
        run: |
          set -o pipefail
          # Some tests deliberately exercise GitHub annotation output. Escape those
          # fixture lines so expected failures do not appear as real workflow errors.
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' 2>&1 \
            | sed -E 's/^::(error|warning)::/expected \1: /'

      - name: Check release notes
        run: scripts/build_release_notes.py --check

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild -project SwiftMiner.xcodeproj \
            -scheme SwiftMiner \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath DerivedData \
            build-for-testing 2>&1 | tee TestBuild.log | tail -200

      # project.yml threads these through as build settings, so a typo or a stale
      # Info.plist entry produces an app that installs and updates incorrectly while
      # every source-level check still passes. Compare what actually shipped.
      - name: Verify built app metadata
        run: |
          set -euo pipefail
          PLIST="DerivedData/Build/Products/Debug/SwiftMiner.app/Contents/Info.plist"

          project_value() {
            sed -nE "s/^[[:space:]]*$1:[[:space:]]*\"?([^\"]+)\"?[[:space:]]*$/\1/p" project.yml | head -n 1
          }
          expect() {
            local key="$1" expected="$2"
            local actual
            actual="$(/usr/libexec/PlistBuddy -c "Print :$key" "$PLIST")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::$key is '$actual' in the built app but '$expected' in project.yml"
              exit 1
            fi
            echo "$key = $actual"
          }

          expect CFBundleShortVersionString "$(project_value MARKETING_VERSION)"
          expect CFBundleVersion "$(project_value CURRENT_PROJECT_VERSION)"
          expect LSApplicationCategoryType "$(project_value LSApplicationCategoryType)"
          expect SUFeedURL "$(project_value SPARKLE_FEED_URL)"
          expect SUPublicEDKey "$(project_value SPARKLE_PUBLIC_ED_KEY)"

      - name: Static analysis
        run: |
          set -o pipefail
          xcodebuild -project SwiftMiner.xcodeproj \
            -scheme SwiftMiner \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath DerivedData \
            analyze | tail -100

      - name: Test
        id: tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild -project SwiftMiner.xcodeproj \
            -scheme SwiftMiner \
            -configuration Debug \
            -destination "platform=macOS,arch=$(uname -m)" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            test-without-building 2>&1 | tee TestResults.log | tail -200

      - name: Summarize test results
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No test result bundle was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult > TestSummary.json; then
            {
              echo "### Test results"
              echo
              echo "The test host did not finish a readable result bundle. Download the failure diagnostics for the complete test log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import sys

          with open("TestSummary.json", encoding="utf-8") as source:
              summary = json.load(source)

          with open(sys.argv[1], "a", encoding="utf-8") as output:
              result = summary.get("result", "Unknown")
              total = summary.get("totalTestCount", 0)
              passed = summary.get("passedTests", 0)
              failed = summary.get("failedTests", 0)
              skipped = summary.get("skippedTests", 0)
              print("### Test results", file=output)
              print(file=output)
              print(
                  f"**{result}** — {passed}/{total} passed, "
                  f"{failed} failed, {skipped} skipped.",
                  file=output,
              )

              failures = summary.get("testFailures") or []
              if isinstance(failures, dict):
                  failures = [failures]
              if failures:
                  print(file=output)
                  for failure in failures:
                      name = failure.get("testName", "Unknown test")
                      detail = " ".join(failure.get("failureText", "").split())
                      print(f"- `{name}` — {detail}", file=output)
          PY

      # Informational for now: reported so coverage movement is visible on every run,
      # with no threshold to fail against until the numbers are somewhere worth holding.
      - name: Report coverage
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d TestResults.xcresult ]]; then
            echo "No test result bundle; skipping coverage report."
            exit 0
          fi
          if ! coverage="$(xcrun xccov view --report --only-targets TestResults.xcresult)"; then
            echo "The result bundle is incomplete; coverage is unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Code coverage"
            echo
            echo '```'
            echo "$coverage"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestBuild.log
            TestResults.log
            TestResults.xcresult
            TestSummary.json
          if-no-files-found: ignore
          retention-days: 14

  release-readiness:
    name: Release readiness
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          marketing_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"?([^" ]+)"?[[:space:]]*$/\1/p' project.yml | head -n 1)"
          expected_tag="v${marketing_version}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match MARKETING_VERSION '$marketing_version'."
            exit 1
          fi
          echo "Release tag matches MARKETING_VERSION: $expected_tag"

      # The preflight validates the published Sparkle feed and curated release notes,
      # then performs a Release build and verifies the metadata in the built app.
      - name: Run release preflight
        id: release_preflight
        env:
          SWIFTMINER_CONFIGURATION: Release
        run: |
          set -o pipefail
          scripts/preflight_release.sh 2>&1 | tee ReleasePreflight.log

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ReleasePreflight.log
          if-no-files-found: ignore
          retention-days: 14
