name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "Website/public/**"
      - "docs/appcast.xml"
      - "docs/beta/appcast.xml"
      - "docs/release-notes/**"
      - "scripts/build_release_notes.py"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Merge ShipHook appcast output
        run: |
          if [ -f docs/appcast.xml ]; then
            cp docs/appcast.xml Website/public/appcast.xml
          fi

          if [ -f docs/beta/appcast.xml ]; then
            mkdir -p Website/public/beta
            cp docs/beta/appcast.xml Website/public/beta/appcast.xml
          fi

      - name: Build release notes
        run: |
          # docs/release-notes is the source of truth — ShipHook can only write there.
          # This publishes those pages into the site and regenerates the index and the
          # sitemap's release-notes URLs, so a ShipHook release needs no manual step.
          python3 scripts/build_release_notes.py --check
          python3 scripts/build_release_notes.py

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
