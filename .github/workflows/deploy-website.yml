name: Deploy website

on:
  push:
    branches:
      - main
    paths:
      - "Website/public/**"
      - "docs/appcast.xml"
      - "docs/release-notes/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Merge ShipHook appcast output
        run: |
          if [ -f docs/appcast.xml ]; then
            cp docs/appcast.xml Website/public/appcast.xml
          fi

          if [ -d docs/release-notes ]; then
            mkdir -p Website/public/release-notes
            for file in docs/release-notes/*.html; do
              [ -e "$file" ] || continue
              target="Website/public/release-notes/$(basename "$file")"
              if [ ! -f "$target" ]; then
                cp "$file" "$target"
              fi
            done
          fi

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: Website/public

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
