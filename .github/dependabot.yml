version: 2
updates:
  # Sparkle and AsyncAlgorithms — Sparkle especially, since it is the app's
  # update mechanism and its security patches matter more than most.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
