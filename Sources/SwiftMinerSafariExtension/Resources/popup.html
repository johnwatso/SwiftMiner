  <img class="mark" src="swiftminer-icon.png" alt="">
  <h1>SwiftMiner</h1>
  <p>This extension is idle. It runs only while SwiftMiner is updating its Twitch
     query hashes, which SwiftMiner starts from Settings &rsaquo; Advanced.</p>
  <p class="fine">It reads only the operation name and hash of Twitch&rsquo;s own
     GraphQL requests during that update &mdash; never cookies, tokens, variables
     or responses.</p>
